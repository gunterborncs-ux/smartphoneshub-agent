name: Smartphones News Agent

on:
  # Запуск только по внешнему триггеру (cron-job.org)
  # Встроенный schedule убран
  workflow_dispatch:

permissions:
  contents: write

# Страховка: не запускать параллельно, если cron-job.org
# случайно дёрнет дважды
concurrency:
  group: smartphones-news-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python main.py

      - name: Commit published history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f published.json ] || echo "{}" > published.json
          git add published.json
          git diff --staged --quiet || git commit -m "chore: update published history [skip ci]"
          git push
